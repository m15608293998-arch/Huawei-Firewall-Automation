---
# 当前生效：单节点测试环境。
trade_access_api:
  firewall_targets:
    - "TEST-FW"
  firewall_parallel_workers: 3
  # 每个防火墙子任务在整个父任务生命周期内累计最多执行 2 次。
  firewall_child_max_attempts: 2
  # 第一次可恢复失败后，父任务释放队列并在该秒数后执行最后一次重试。
  firewall_reconcile_retry_seconds: 30

default_firewall_code: "TEST-FW"

firewall_profiles:
  TEST-FW:
    firewall_device:
      device_host: "<TEST_FIREWALL_MGMT_IP>"
      device_user: "<TEST_FIREWALL_USER>"
      auth_type: "password"
      device_password: "<TEST_FIREWALL_PASSWORD>"
    address_vsystems:
      - name: "public"
        address_set_name: "TraderServers-DirectAccess-IPs"
        switch_required: false
      - name: "Internet"
        address_set_name: "TraderServers-DirectAccess-IPs"
        switch_required: true
      - name: "private"
        address_set_name: "TraderServers-DirectAccess-IPs"
        switch_required: true
    application_vsystem: "private"
    user_defined_application:
      name_prefix: "UD_TServe_"
      category: "General"
      subcategory: "General_TCP"
      data_model: "client-server"
      label: "Business-Applications"
      application_group_name: "UDG_TradeServers"

# 每条 Rule 最多 4 个端口，每个 Application 最多 8 条 Rule。
application_ports:
  - 12001
  - 12002
  - 12003
  - 12004
rule_port_limit: 4
application_rule_limit: 8
enable_application_config: true
commit_security_engine: true
save_config: true
local_tmp_dir: "/tmp/usg6000e_trade_access"

