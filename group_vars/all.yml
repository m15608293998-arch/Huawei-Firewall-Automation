---
# 华为 USG6000E 测试节点管理地址
# firewall_device:
#   device_host: "<TEST_FIREWALL_MGMT_IP>"
#   device_user: "<TEST_FIREWALL_USER>"
#   auth_type: "publickey"
#   identity_file: "/absolute/path/to/test_firewall_private_key"
firewall_device: &test_firewall_device
    device_host: "<TEST_FIREWALL_MGMT_IP>"
    device_user: "<TEST_FIREWALL_USER>"
    auth_type: "password"
    device_password: "<FIREWALL_PASSWORD>"
 
address_vsystems: &test_address_vsystems
  - name: "public"
    address_set_name: "TraderServers-DirectAccess-IPs"
    switch_required: false

  - name: "Internet"
    address_set_name: "TraderServers-DirectAccess-IPs"
    switch_required: true

  - name: "private"
    address_set_name: "TraderServers-DirectAccess-IPs"
    switch_required: true

# User-Defined Application 只在 private 里配置
application_vsystem: &test_application_vsystem "private"

# 自定义应用配置
user_defined_application: &test_user_defined_application
  name_prefix: "UD_TServe_"
  category: "General"
  subcategory: "General_TCP"
  data_model: "client-server"
  label: "Business-Applications"
  application_group_name: "UDG_TradeServers"

default_firewall_code: "TEST-FW"

# 当前测试环境只启用一个逻辑目标。生产环境通过同一结构配置三台设备，
# 并由 TRADE_ACCESS_API_FIREWALL_TARGETS 决定一个父任务要执行哪些目标。
firewall_profiles:
  TEST-FW:
    firewall_device: *test_firewall_device
    address_vsystems: *test_address_vsystems
    application_vsystem: *test_application_vsystem
    user_defined_application: *test_user_defined_application

# 需要放行的业务端口
# 每条 rule 最多 4 个端口，每个 Application 最多 8 条 rule（32 个端口）
# 超出后自动使用 UD_TServe_<IP>_2、UD_TServe_<IP>_3 等后续对象
application_ports:
  - 12001
  - 12002
  - 12003
  - 12004
rule_port_limit: 4
application_rule_limit: 8

# 测试阶段先 false，确认没问题后再改 true
enable_application_config: true
commit_security_engine: true
save_config: true
# Ansible 控制节点本地临时目录
local_tmp_dir: "/tmp/usg6000e_trade_access"
