---
- name: Add target IP to address set in each virtual system
  ansible.builtin.include_tasks: address_vsystem.yml
  loop: "{{ address_vsystems }}"
  loop_control:
    loop_var: address_context

- name: Configure user-defined application in private virtual system
  ansible.builtin.include_tasks: application.yml
  when: enable_application_config | default(true) | bool
