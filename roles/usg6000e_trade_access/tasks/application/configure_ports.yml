---
- name: Render application inventory query
  ansible.builtin.template:
    src: application/query_inventory.cli.j2
    dest: "{{ local_tmp_dir }}/query_application_inventory_{{ access_request.target_ip }}.cli"
    mode: "0600"

- name: Query application inventory for target IP
  ansible.builtin.command:
    argv: "{{ firewall_cli_command_prefix + ['--cli-file', local_tmp_dir ~ '/query_application_inventory_' ~ access_request.target_ip ~ '.cli'] }}"
  environment: "{{ firewall_cli_environment }}"
  register: application_inventory_result
  changed_when: false
  failed_when:
    - application_inventory_result.rc != 0 or
      'Unrecognized command' in application_inventory_result.stdout or
      'Too many parameters' in application_inventory_result.stdout

- name: Save application inventory output
  ansible.builtin.copy:
    dest: "{{ local_tmp_dir }}/application_inventory_{{ access_request.target_ip }}.out"
    mode: "0600"
    content: "{{ application_inventory_result.stdout }}"
  changed_when: false

- name: Parse application inventory
  ansible.builtin.command:
    argv:
      - "{{ local_python_interpreter | default('python3.12') }}"
      - "{{ role_path }}/files/extract_usg_application_names.py"
      - "--file"
      - "{{ local_tmp_dir }}/application_inventory_{{ access_request.target_ip }}.out"
      - "--base-app-name"
      - "{{ base_app_name }}"
  register: application_inventory_parse_result
  changed_when: false
  failed_when: application_inventory_parse_result.rc != 0

- name: Set application inventory facts
  ansible.builtin.set_fact:
    application_inventory_state: "{{ application_inventory_parse_result.stdout | from_json }}"
    application_names_to_query: "{{ (application_inventory_parse_result.stdout | from_json).object_names }}"

- name: Render exact application detail queries
  ansible.builtin.template:
    src: application/query_details.cli.j2
    dest: "{{ local_tmp_dir }}/query_application_details_{{ access_request.target_ip }}.cli"
    mode: "0600"
  when: application_names_to_query | length > 0

- name: Query exact application details in one SSH session
  ansible.builtin.command:
    argv: "{{ firewall_cli_command_prefix + ['--cli-file', local_tmp_dir ~ '/query_application_details_' ~ access_request.target_ip ~ '.cli'] }}"
  environment: "{{ firewall_cli_environment }}"
  register: application_details_result
  changed_when: false
  failed_when:
    - application_details_result.rc != 0 or
      'Unrecognized command' in application_details_result.stdout or
      'Too many parameters' in application_details_result.stdout or
      'The specified object does not exist' in application_details_result.stdout
  when: application_names_to_query | length > 0

- name: Save combined application discovery output
  ansible.builtin.copy:
    dest: "{{ local_tmp_dir }}/application_discovery_{{ access_request.target_ip }}.out"
    mode: "0600"
    content: |
      {{ application_inventory_result.stdout }}
      {{ application_details_result.stdout | default('') }}
  changed_when: false

- name: Build application port plan
  ansible.builtin.command:
    argv:
      - "{{ local_python_interpreter | default('python3.12') }}"
      - "{{ role_path }}/files/extract_usg_application_names.py"
      - "--file"
      - "{{ local_tmp_dir }}/application_discovery_{{ access_request.target_ip }}.out"
      - "--base-app-name"
      - "{{ base_app_name }}"
      - "--target-ip"
      - "{{ access_request.target_ip }}"
      - "--mask"
      - "{{ access_request.mask | default(32) | string }}"
      - "--requested-ports-json"
      - "{{ application_ports_int | to_json }}"
      - "--mode"
      - "{{ application_port_mode | default('add') }}"
      - "--rule-port-limit"
      - "{{ rule_port_limit | int | string }}"
      - "--application-rule-limit"
      - "{{ application_rule_limit | default(8) | int | string }}"
  register: application_plan_result
  changed_when: false
  failed_when: application_plan_result.rc != 0

- name: Set application plan facts
  ansible.builtin.set_fact:
    application_state: "{{ application_plan_result.stdout | from_json }}"
    application_plan: "{{ (application_plan_result.stdout | from_json).plan }}"
    application_names_to_validate: "{{ (application_plan_result.stdout | from_json).plan.desired_names }}"

- name: Reject an existing application object that points at another IP
  ansible.builtin.assert:
    that:
      - application_state.all_target_ips_match | bool
    fail_msg: >-
      Refusing to modify {{ application_state.invalid_target_applications }} because
      an application name belonging to {{ access_request.target_ip }} contains a
      different target IP or mask.

- name: Reject invalid existing application ports
  ansible.builtin.assert:
    that:
      - application_state.all_ports_valid | bool
    fail_msg: >-
      Refusing to modify {{ base_app_name }} because the firewall returned invalid
      application ports: {{ application_state.invalid_ports }}.

- name: Show application port plan
  ansible.builtin.debug:
    msg:
      mode: "{{ application_plan.mode }}"
      requested_ports: "{{ application_plan.requested_ports }}"
      existing_ports: "{{ application_plan.existing_ports }}"
      new_ports: "{{ application_plan.new_ports }}"
      removed_ports: "{{ application_plan.removed_ports }}"
      effective_ports: "{{ application_plan.effective_ports }}"
      application_names: "{{ application_plan.desired_names }}"
      change_needed: "{{ application_plan.change_needed }}"
      change_reasons: "{{ application_plan.change_reasons }}"
      operations: "{{ application_plan.operations }}"

- name: Render incremental application port changes
  ansible.builtin.template:
    src: application/incremental_ports.cli.j2
    dest: "{{ local_tmp_dir }}/incremental_application_ports_{{ access_request.target_ip }}.cli"
    mode: "0600"
  when: application_plan.change_needed | bool

- name: Apply incremental application port changes in one SSH session
  ansible.builtin.command:
    argv: "{{ firewall_cli_command_prefix + ['--cli-file', local_tmp_dir ~ '/incremental_application_ports_' ~ access_request.target_ip ~ '.cli'] }}"
  environment: "{{ firewall_cli_environment }}"
  register: application_config_result
  changed_when: true
  failed_when:
    - >-
      application_config_result.rc != 0 or
      'Unrecognized command' in application_config_result.stdout or
      'Too many parameters' in application_config_result.stdout or
      'Error:' in (
        application_config_result.stdout
        | regex_replace(
            '(?m)^\\s*Error: The application is already exist in the application group\\.\\s*$',
            ''
          )
      )
  when: application_plan.change_needed | bool

- name: Show incremental application configuration output
  ansible.builtin.debug:
    var: application_config_result.stdout_lines
  when: application_plan.change_needed | bool

- name: Mark firewall changed after application port changes
  ansible.builtin.set_fact:
    firewall_mutated: true
  when: application_plan.change_needed | bool

- name: Render exact application validation query
  ansible.builtin.template:
    src: application/query_validation.cli.j2
    dest: "{{ local_tmp_dir }}/query_application_validation_{{ access_request.target_ip }}.cli"
    mode: "0600"
  when: application_plan.change_needed | bool

- name: Query application objects and group membership after incremental change
  ansible.builtin.command:
    argv: "{{ firewall_cli_command_prefix + ['--cli-file', local_tmp_dir ~ '/query_application_validation_' ~ access_request.target_ip ~ '.cli'] }}"
  environment: "{{ firewall_cli_environment }}"
  register: application_validation_result
  changed_when: false
  failed_when:
    - application_validation_result.rc != 0 or
      'Unrecognized command' in application_validation_result.stdout or
      'Too many parameters' in application_validation_result.stdout or
      'The specified object does not exist' in application_validation_result.stdout
  when: application_plan.change_needed | bool

- name: Save application validation output
  ansible.builtin.copy:
    dest: "{{ local_tmp_dir }}/application_validation_{{ access_request.target_ip }}.out"
    mode: "0600"
    content: "{{ application_validation_result.stdout }}"
  changed_when: false
  when: application_plan.change_needed | bool

- name: Parse application state after incremental change
  ansible.builtin.command:
    argv:
      - "{{ local_python_interpreter | default('python3.12') }}"
      - "{{ role_path }}/files/extract_usg_application_names.py"
      - "--file"
      - "{{ local_tmp_dir }}/application_validation_{{ access_request.target_ip }}.out"
      - "--base-app-name"
      - "{{ base_app_name }}"
      - "--target-ip"
      - "{{ access_request.target_ip }}"
      - "--mask"
      - "{{ access_request.mask | default(32) | string }}"
      - "--requested-ports-json"
      - "{{ application_plan.effective_ports | to_json }}"
      - "--rule-port-limit"
      - "{{ rule_port_limit | int | string }}"
      - "--application-rule-limit"
      - "{{ application_rule_limit | default(8) | int | string }}"
  register: application_validation_parse_result
  changed_when: false
  failed_when: application_validation_parse_result.rc != 0
  when: application_plan.change_needed | bool

- name: Validate incremental application state on firewall
  ansible.builtin.assert:
    that:
      - application_validation_state.all_target_ips_match | bool
      - application_validation_state.all_ports_valid | bool
      - not application_validation_state.plan.change_needed | bool
      - application_validation_state.plan.existing_ports == application_plan.effective_ports
    fail_msg: >-
      Firewall application validation failed after incremental port change.
      Expected plan: {{ application_plan }}.
      Actual state: {{ application_validation_state }}.
    success_msg: >-
      Firewall applications match the requested port operation result.
  vars:
    application_validation_state: "{{ application_validation_parse_result.stdout | from_json }}"
  when: application_plan.change_needed | bool

- name: Confirm requested ports already exist
  ansible.builtin.debug:
    msg: >-
      No application port change was needed. The requested {{ application_port_mode | default('add') }}
      port operation is already reflected for {{ access_request.target_ip }}.
  when: not application_plan.change_needed | bool
