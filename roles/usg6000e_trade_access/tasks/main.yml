---
- name: Resolve logical firewall profile
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/resolve_firewall.yml"

- name: Resolve firewall workflow mode
  ansible.builtin.set_fact:
    firewall_workflow_mode_resolved: >-
      {{
        firewall_workflow_mode
        | default(
            'access'
            if access_request is defined
            else ('snapshot' if snapshot_mode is defined else 'access')
          )
      }}

- name: Validate firewall workflow mode
  ansible.builtin.assert:
    that:
      - firewall_workflow_mode_resolved in ['access', 'snapshot']
    fail_msg: "firewall_workflow_mode must be access or snapshot"

- name: Run firewall snapshot workflow
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/snapshot/main.yml"
  when: firewall_workflow_mode_resolved == 'snapshot'

- name: Run firewall access workflow
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/access/main.yml"
  when: firewall_workflow_mode_resolved == 'access'
