---
- name: Validate access request
  ansible.builtin.assert:
    that:
      - access_request is defined
      - access_request.action is defined
      - access_request.action in ['allow', 'allow_ip', 'allow_ports', 'deny', 'deny_ports', 'deny_ip']
      - access_request.target_ip is defined
      - access_request.requester is defined
      - access_request.request_id is defined
    fail_msg: >-
      access_request must include action allow/allow_ip/allow_ports/deny/deny_ports/deny_ip,
      target_ip, requester and request_id.

- name: Resolve firewall SSH auth type
  ansible.builtin.set_fact:
    firewall_ssh_auth_type: "{{ firewall_device.auth_type | default('publickey') | lower }}"

- name: Validate firewall SSH configuration
  ansible.builtin.assert:
    that:
      - firewall_device is defined
      - firewall_device.device_host is defined
      - firewall_device.device_user is defined
      - firewall_ssh_auth_type in ['publickey', 'password']
      - >-
        (
          firewall_ssh_auth_type == 'publickey'
          and (firewall_device.identity_file | default('') | string | length > 0)
        )
        or
        (
          firewall_ssh_auth_type == 'password'
          and (firewall_device.device_password | default('') | string | length > 0)
        )
    fail_msg: >-
      firewall_device must define device_host, device_user, auth_type
      (publickey or password), and the matching credential field:
      identity_file for publickey or device_password for password.

- name: Check firewall SSH identity file
  ansible.builtin.stat:
    path: "{{ firewall_device.identity_file }}"
  register: firewall_identity_file
  when: firewall_ssh_auth_type == 'publickey'

- name: Validate firewall SSH identity file
  ansible.builtin.assert:
    that:
      - firewall_identity_file.stat.exists
      - firewall_identity_file.stat.isreg
      - firewall_identity_file.stat.readable | default(false)
    fail_msg: >-
      Firewall SSH identity file {{ firewall_device.identity_file }} is not present
      or not readable by the API service user. Create/copy the private key for
      the service account and make sure it has mode 0600.
  when: firewall_ssh_auth_type == 'publickey'

- name: Set base runtime facts
  ansible.builtin.set_fact:
    target_ip_cidr: "{{ access_request.target_ip }}/{{ access_request.mask | default(32) }}"
    target_description: "{{ access_request.description | default('trade-server-' ~ access_request.target_ip) }}"
    base_app_name: "{{ user_defined_application.name_prefix }}{{ access_request.target_ip }}"
    application_ports_int: "{{ (application_ports if access_request.action in ['allow', 'allow_ports', 'deny_ports'] else []) | map('int') | unique | sort | list }}"
    firewall_mutated: false
    firewall_cli_environment: >-
      {{
        {'USG6000E_DEVICE_PASSWORD': firewall_device.device_password}
        if firewall_ssh_auth_type == 'password'
        else {}
      }}
    firewall_cli_command_prefix: >-
      {{
        [
          local_python_interpreter | default('python3.12'),
          role_path ~ '/files/run_usg_cli.py',
          '--host',
          firewall_device.device_host,
          '--user',
          firewall_device.device_user,
        ] + (
          ['--password-env-var', 'USG6000E_DEVICE_PASSWORD']
          if firewall_ssh_auth_type == 'password'
          else ['--identity-file', firewall_device.identity_file]
        )
      }}

- name: Validate application ports
  ansible.builtin.assert:
    that:
      - application_ports_int | length > 0
      - application_ports_int | min >= 1
      - application_ports_int | max <= 65535
    fail_msg: "Port operations require at least one unique TCP port between 1 and 65535."
  when: access_request.action in ['allow', 'allow_ports', 'deny_ports']

- name: Ensure local temp directory exists
  ansible.builtin.file:
    path: "{{ local_tmp_dir }}"
    state: directory
    mode: "0700"

- name: Run allow workflow
  ansible.builtin.include_tasks: allow.yml
  when: access_request.action == 'allow'

- name: Run IP allow workflow
  ansible.builtin.include_tasks: allow_ip.yml
  when: access_request.action == 'allow_ip'

- name: Run port allow workflow
  ansible.builtin.include_tasks: allow_ports.yml
  when: access_request.action == 'allow_ports'

- name: Run deny workflow
  ansible.builtin.include_tasks: deny.yml
  when: access_request.action == 'deny'

- name: Run port deny workflow
  ansible.builtin.include_tasks: deny_ports.yml
  when: access_request.action == 'deny_ports'

- name: Run IP deny workflow
  ansible.builtin.include_tasks: deny_ip.yml
  when: access_request.action == 'deny_ip'

- name: Render final commit and save command
  ansible.builtin.copy:
    dest: "{{ local_tmp_dir }}/final_commit_save.cli"
    mode: "0600"
    content: |
      {% if commit_security_engine | default(true) | bool %}
      system-view
      {% if application_vsystem | lower != 'public' %}
      switch vsys {{ application_vsystem }}
      system-view
      {% endif %}
      engine configuration commit
      {% if application_vsystem | lower != 'public' %}
      quit
      quit
      {% endif %}
      quit
      {% endif %}
      {% if save_config | default(false) | bool %}
      save
      {% endif %}
  when:
    - firewall_mutated | default(false) | bool
    - commit_security_engine | default(true) | bool or save_config | default(false) | bool

- name: Commit and save firewall configuration in one SSH session
  ansible.builtin.command:
    argv: "{{ firewall_cli_command_prefix + ['--cli-file', local_tmp_dir ~ '/final_commit_save.cli'] }}"
  environment: "{{ firewall_cli_environment }}"
  register: final_commit_save_result
  changed_when: true
  failed_when:
    - final_commit_save_result.rc != 0 or
      'Unrecognized command' in final_commit_save_result.stdout or
      'Too many parameters' in final_commit_save_result.stdout or
      'Invalid file name' in final_commit_save_result.stdout or
      'Invalid extension' in final_commit_save_result.stdout
  when:
    - firewall_mutated | default(false) | bool
    - commit_security_engine | default(true) | bool or save_config | default(false) | bool

- name: Show final commit and save result
  ansible.builtin.debug:
    var: final_commit_save_result.stdout_lines
  when:
    - firewall_mutated | default(false) | bool
    - commit_security_engine | default(true) | bool or save_config | default(false) | bool

- name: Report unchanged firewall state
  ansible.builtin.debug:
    msg: "No firewall configuration changed; skipping engine commit and save."
  when: not (firewall_mutated | default(false) | bool)
