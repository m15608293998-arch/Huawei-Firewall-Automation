---
- name: Render address-set snapshot query for {{ address_context.name }}
  ansible.builtin.template:
    src: snapshot/query_address_inventory.cli.j2
    dest: "{{ local_tmp_dir }}/query_address_set_inventory_{{ address_context.name }}.cli"
    mode: "0600"
  changed_when: false

- name: Track address-set snapshot source for {{ address_context.name }}
  ansible.builtin.set_fact:
    snapshot_address_sources: >-
      {{
        (snapshot_address_sources | default([]))
        + [
          {
            'vsystem': address_context.name,
            'path': local_tmp_dir ~ '/address_inventory_all.out',
            'cli_file': local_tmp_dir ~ '/query_address_set_inventory_' ~ address_context.name ~ '.cli'
          }
        ]
      }}
  changed_when: false
